name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and test (iOS Simulator)
        run: |
          xcodebuild test \
            -project YTMusicPlus.xcodeproj \
            -scheme YTMusicPlus \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Write export options
        run: |
          cat > build/exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
          </dict>
          </plist>
          PLIST

      - name: Archive and export IPA
        run: |
          xcodebuild \
            -project YTMusicPlus.xcodeproj \
            -scheme YTMusicPlus \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/YTMusicPlus.xcarchive \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            -quiet archive
          xcodebuild -exportArchive \
            -archivePath build/YTMusicPlus.xcarchive \
            -exportFormat ipa \
            -exportPath build/ipa \
            -exportOptionsPlist build/exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicPlus-ipa
          path: build/ipa/YTMusicPlus.ipa
          retention-days: 7
