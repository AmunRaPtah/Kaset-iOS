name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and test (iOS Simulator)
        run: |
          xcodebuild test \
            -project YTMusicPlus.xcodeproj \
            -scheme YTMusicPlus \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and package IPA
        run: |
          mkdir -p build/Payload
          xcodebuild \
            -project YTMusicPlus.xcodeproj \
            -scheme YTMusicPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            ONLY_ACTIVE_ARCH=NO \
            | tee build/build.log
          cp -r build/dd/Build/Products/Release-iphoneos/YTMusicPlus.app build/Payload/
          cd build && zip -r ipa/YTMusicPlus.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicPlus-ipa
          path: build/ipa/YTMusicPlus.ipa
          retention-days: 7
