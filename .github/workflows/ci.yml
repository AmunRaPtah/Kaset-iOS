name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and test (iOS Simulator)
        run: |
          xcodebuild test \
            -project YTMusicPlus.xcodeproj \
            -scheme YTMusicPlus \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

  ipa:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build and package IPA
        run: |
          set -euo pipefail
          xcodebuild build \
            -project YTMusicPlus.xcodeproj \
            -scheme YTMusicPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/dd-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
          APP=build/dd-device/Build/Products/Release-iphoneos/YTMusicPlus.app
          test -x "$APP/YTMusicPlus"
          rm -rf build/Payload build/ipa && mkdir -p build/Payload build/ipa
          cp -R "$APP" build/Payload/
          (cd build && zip -qry ipa/YTMusicPlus.ipa Payload)
          unzip -l build/ipa/YTMusicPlus.ipa | head -5

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicPlus-ipa
          path: build/ipa/YTMusicPlus.ipa
          retention-days: 30
