name: YTMusicPlus
options:
  bundleIdPrefix: com.enniol
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  YTMusicPlus:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: YTMusic+
        CFBundleLocalizations: [en, fr]
        CFBundleDevelopmentRegion: en
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.enniol.ytmusicplus.newReleases
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets you pull spike-log.txt out through the Files app / Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enniol.ytmusicplus
        PRODUCT_NAME: YTMusicPlus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  YTMusicPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/YTMusicPlusTests
    dependencies:
      - target: YTMusicPlus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.enniol.ytmusicplus.tests
